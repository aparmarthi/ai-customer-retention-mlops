name: Build & Deploy — Churn API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]   # builds image on PRs but does NOT deploy

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/churn-api

jobs:
  # ── 1. Run tests ────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install serving dependencies
        run: pip install -r requirements-serve.txt pytest httpx   # httpx required by fastapi TestClient

      - name: Run API and policy tests
        run: python -m pytest src/serving -v   # -m puts repo root on sys.path for `from src...`

      - name: Eval gate (economics, parity, contract, latency against the in-process API)
        run: python -m evals.run --api-url local --n 20

  # ── 1b. Front end: typecheck, unit tests, build (independent of the API deploy) ──
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # ── 2. Build and push Docker image ──────────────────────────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write    # allows push to ghcr.io

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx   # required for type=gha cache export
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-injected, no setup needed

      - name: Extract image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-          # e.g. sha-a1b2c3d  — exact commit
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}   # only push on merge, not PRs
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha     # GitHub Actions layer cache — speeds up rebuilds
          cache-to: type=gha,mode=max

  # ── 3. Deploy to Google Cloud Run (main branch only) ────────────────────────
  # Builds from source via Cloud Build → Artifact Registry (Cloud Run cannot pull from ghcr.io).
  # Keyless auth via Workload Identity Federation: GitHub OIDC token → short-lived credential for
  # github-churn-deployer (roles/run.sourceDeveloper). The WIF provider only trusts this repo's main.
  # Skipped if the GCP_WIF_PROVIDER / GCP_DEPLOY_SA repo variables are not set (e.g. on forks).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.GCP_WIF_PROVIDER != ''
    permissions:
      contents: read
      id-token: write    # lets the job request a GitHub OIDC token for WIF

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF, no stored key)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: churn-api
          region: us-central1
          project_id: finsight-gpu
          source: ./
          # No --allow-unauthenticated: the public invoker binding persists across revisions,
          # so the deployer never needs IAM-admin (setIamPolicy) permissions.
          flags: |
            --memory=1Gi
            --cpu=1
            --min-instances=0
            --max-instances=3
            --port=8000

      - name: Smoke test /health
        run: curl -fsS --retry 5 --retry-delay 5 "${{ steps.deploy.outputs.url }}/health"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Post-deploy eval (deployed revision reproduces reference scores and contract)
        env:
          API_KEY: ${{ secrets.API_KEY }}   # empty unless the service is configured with a key
        run: |
          pip install "numpy>=1.26,<3.0" "requests>=2.31,<3.0"
          python -m evals.run --api-url "${{ steps.deploy.outputs.url }}" --n 20
